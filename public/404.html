<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Declaração Online - Redirecionando...</title>
  <script>
    // Single Page Apps for GitHub Pages or static hosts fallback
    // Preserves the path and query string when redirected
    var pathSegmentsToKeep = 0;
    var l = window.location;
    var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
    var search = l.search ? '&' + l.search.slice(1) : '';
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?p=/' + path + search + l.hash
    );
  </script>
</head>
<body>
</body>
</html>
