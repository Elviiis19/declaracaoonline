<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with squircle/rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Document paper sheet -->
  <g transform="translate(106, 86)">
    <path d="M40 0 H200 L260 60 V300 C260 317.67 245.67 332 228 332 H40 C22.33 332 8 317.67 8 300 V32 C8 14.33 22.33 0 40 0 Z" fill="#ffffff" />
    <!-- Fold corner -->
    <path d="M200 0 L260 60 H216 C207.16 60 200 52.84 200 44 V0 Z" fill="#e2e8f0" />
    <!-- Document lines -->
    <rect x="42" y="70" width="130" height="14" rx="7" fill="#0f766e" />
    <rect x="42" y="106" width="176" height="10" rx="5" fill="#cbd5e1" />
    <rect x="42" y="132" width="176" height="10" rx="5" fill="#cbd5e1" />
    <rect x="42" y="158" width="140" height="10" rx="5" fill="#cbd5e1" />
    <rect x="42" y="184" width="160" height="10" rx="5" fill="#cbd5e1" />
    <rect x="42" y="210" width="120" height="10" rx="5" fill="#cbd5e1" />
    <!-- Signature line -->
    <line x1="42" y1="270" x2="180" y2="270" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4" />
    <circle cx="210" cy="270" r="14" fill="#10b981" opacity="0.15" />
  </g>

  <!-- Official verified badge in bottom right -->
  <g transform="translate(300, 300)">
    <circle cx="64" cy="64" r="54" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="8" />
    <path d="M44 64 L58 78 L86 50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
